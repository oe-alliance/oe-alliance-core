# MACHINEBUILDS: pulse4k pulse4kmini
#@TYPE: Machine
#@NAME: abmv200
#@DESCRIPTION: Shared machine for AB-COM PULSe 4K / PULSe 4K MINI (hisi3798mv200)

SOC_FAMILY = "hisi3798mv200"
MACHINE_FEATURES += " retrogaming retrogaming-hisi4k"
HICHIPSET = "3798mv200"
VER = "-v2"

# Register MACHINEBUILD as an extra package arch so recipes with
# PACKAGE_ARCH = "${MACHINEBUILD}" can be found by dependencies.
OEM_ARCH = "${MACHINEBUILD}"

MACHINE_FEATURES += "hisil mali emmc skins1080 ${E2EGL_WQHD_FEATURE} multitranscoding kodi22 himedia no-subssupport blindscan-dvbs gfwol WOL ci fastboot mountboot ${E2EGL_MACHINE_FEATURE}"
MACHINE_FEATURES:append:pulse4k = " 7segment dvb-c"

BRAND_OEM = "abcom"
MACHINE_BRAND = "AB-COM"
IMAGEDIR = "${MACHINEBUILD}"
MACHINE_NAME:pulse4k = "PULSe 4K"
MACHINE_NAME:pulse4kmini = "PULSe 4K MINI"

EXTRA_OECONF:append:pn-enigma2 = " --with-alphablendingacceleration=always --with-blitaccelerationthreshold=250  --with-fillaccelerationthreshold=190000"

KERNEL_FILE = "uImage"
ROOTFS_FILE = "rootfs.tar.bz2"
MTD_BLACK  = "mmcblk0"
MTD_BOOTFS = "mmcblk0p4"
MTD_KERNEL = "mmcblk0p20"
MTD_ROOTFS = "mmcblk0p21"

IMAGE_CLASSES += " abemmc-fastboot8gb_image"
IMAGE_FSTYPES += "abfastboot8gb"

require conf/machine/include/abcom-hisil-3798mv200.inc
