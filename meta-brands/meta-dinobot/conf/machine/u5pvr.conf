#@TYPE: Machine
#@NAME: u5pvr
#@DESCRIPTION: Machine configuration for the u5pvr

EXTRA_OECONF:append:pn-enigma2 = " --with-lcddev=/dev/null --with-alphablendingacceleration=always"

SOC_FAMILY = "hisi3798cv200"

SDCARD = "yes"

MACHINE_FEATURES += " chkrootmb videoenhancement RCA 7segment skins1080 kodi21"

require conf/machine/include/dinobot-cortexa15.inc
require conf/machine/include/dinobot-emmc.inc

VER = "-chiper"

KERNEL_MODULE_AUTOLOAD += "brcmutil"
KERNEL_MODULE_AUTOLOAD += "brcmfmac"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "\
    kernel-module-brcmutil \
    kernel-module-brcmfmac \
"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += "\
    kernel-module-cdfs \
    kernel-module-hid \
    kernel-module-isofs \
    kernel-module-udf \
    kernel-module-nfs \
    kernel-module-nfsv2 \
    kernel-module-nfsv3 \
    kernel-module-nfsv4 \
    kernel-module-nfsd \
    kernel-module-cifs \
    kernel-module-usbhid \
    kernel-module-exportfs \
    kernel-module-cfg80211 \
    kernel-module-lib80211 \
    kernel-module-ext2 \
    kernel-module-ipv6 \
    "
