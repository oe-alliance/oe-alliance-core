# MACHINEBUILDS: formuler1 formuler1tc
#@TYPE: Machine
#@NAME: fm7356
#@DESCRIPTION: Shared machine for Formuler F1 (bcm7356)

MACHINE_NAME = "F1"

RCHARDWARE:formuler1 = "V2"

IMAGEDIR:formuler1tc = "formuler1"

FLASHSIZE = "512"

PREFERRED_VERSION_linux-formuler = "4.10.6"

OEM_ARCH = "${MACHINEBUILD}"

SOC_FAMILY = "bcm7356"

UBI_VOLNAME = "rootfs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 8192"
UBINIZE_ARGS = "-m 2048 -p 128KiB"

MACHINE_FEATURES += "ubimb chkrootmb emmc dvb-c textlcd videoenhancement HDMI YUV RCA"
MACHINE_FEATURES:append:formuler1   = " v3d kodi22 ${E2EGL_MACHINE_FEATURE}"
MACHINE_FEATURES:append:formuler1tc = " multitranscoding al-driver"

require conf/machine/include/formuler.inc
