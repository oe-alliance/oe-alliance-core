# MACHINEBUILDS: formuler3 formuler3ip formuler4 formuler4ip
#@TYPE: Machine
#@NAME: fm7362
#@DESCRIPTION: Shared machine for Formuler F3/F4 (bcm7362)

MACHINE_NAME:formuler3   = "F3"
MACHINE_NAME:formuler3ip = "F3"
MACHINE_NAME:formuler4   = "F4"
MACHINE_NAME:formuler4ip = "F4"

RCHARDWARE:formuler3 = "V2"
RCHARDWARE:formuler4 = "V2"

IMAGEDIR:formuler3ip = "formuler3"
IMAGEDIR:formuler4ip = "formuler4"

FLASHSIZE = "256"

PREFERRED_VERSION_linux-formuler = "4.10.6"

OEM_ARCH = "${MACHINEBUILD}"

SOC_FAMILY = "bcm7362"

UBI_VOLNAME = "rootfs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 8192"
UBINIZE_ARGS = "-m 2048 -p 128KiB"

MACHINE_FEATURES += "ubimb chkrootmb emmc videoenhancement 7segment HDMI singlecore"
MACHINE_FEATURES:append:formuler3ip = " al-driver"
MACHINE_FEATURES:append:formuler4   = " AV_JACK"
MACHINE_FEATURES:append:formuler4ip = " al-driver AV_JACK"

require conf/machine/include/formuler.inc
