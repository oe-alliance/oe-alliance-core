# MACHINEBUILDS: dm500hd dm800se
#@TYPE: Machine
#@NAME: dm7405nand
#@DESCRIPTION: Shared machine for Dreambox DM500HD / DM800SE (bcm7405, 64MB brcmnand)

MACHINE_NAME:dm500hd = "DM500HD"
MACHINE_NAME:dm800se = "DM800SE"

OEM_ARCH = "${MACHINEBUILD}"
MACHINE_DRIVER = "${MACHINEBUILD}"

RCNAME = "dmm1"

MACHINE_FEATURES += "dvb-c blindscan-dvbc hdmicec fan libpassthrough usbconsole dreamboxv1 omb HDMI SCART"
MACHINE_FEATURES:append:dm800se = " colorlcd bwlcd96"

require conf/machine/include/dreambox-brcmnand.inc
require conf/machine/include/dreambox-nand-64mb.inc
require conf/machine/include/dreambox-part-64mb.inc
require conf/machine/include/dreambox-tar.inc
require conf/machine/include/dreambox-mips32el.inc

SOC_FAMILY = "bcm7405"

MACHINEOVERRIDES .= ":dreamboxv1"
