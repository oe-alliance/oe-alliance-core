# MACHINEBUILDS: dm500hdv2 dm800sev2 dm7020hdv2
#@TYPE: Machine
#@NAME: dm7405ubi
#@DESCRIPTION: Shared machine for Dreambox DM500HDv2 / DM800SEv2 / DM7020HDv2 (bcm7405, 1024MB 2k-page UBI)

MACHINE_NAME:dm500hdv2  = "DM500HDV2"
MACHINE_NAME:dm800sev2  = "DM800SEV2"
MACHINE_NAME:dm7020hdv2 = "DM7020HDV2"

OEM_ARCH = "${MACHINEBUILD}"
MACHINE_DRIVER = "${MACHINEBUILD}"

RCNAME = "dmm2"

FLASHSIZE:dm500hdv2  = "96"
FLASHSIZE:dm800sev2  = "96"
FLASHSIZE:dm7020hdv2 = "64"

MACHINE_FEATURES += "ubimb chkrootmb emmc dvb-c blindscan-dvbc hdmicec libpassthrough usbconsole dreamboxv1 omb smallflash HDMI SCART"
MACHINE_FEATURES:append:dm500hdv2  = " fan"
MACHINE_FEATURES:append:dm800sev2  = " colorlcd bwlcd96 fan"
MACHINE_FEATURES:append:dm7020hdv2 = " ci dvd colorlcd128 grautec RCA"

MACHINE_EXTRA_RRECOMMENDS:append:dm7020hdv2 = " dreambox-enigma2-config"

require conf/machine/include/dreambox-hw-ecc.inc
require conf/machine/include/dreambox-nand-1024mb-2k.inc
require conf/machine/include/dreambox-part-1024mb.inc
require conf/machine/include/dreambox-ubi.inc
require conf/machine/include/dreambox-mips32el.inc

SOC_FAMILY = "bcm7405"

MACHINEOVERRIDES .= ":dreamboxv1"
