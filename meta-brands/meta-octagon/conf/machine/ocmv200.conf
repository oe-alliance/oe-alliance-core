# MACHINEBUILDS: sf8008 sf8008m
#@TYPE: Machine
#@NAME: ocmv200
#@DESCRIPTION: Shared machine for Octagon SF8008 / SF8008 Mini (hisi3798mv200)

MACHINE_NAME:sf8008  = "SF8008 4K UHD"
MACHINE_NAME:sf8008m = "SF8008 MINI 4K"

OEM_ARCH = "${MACHINEBUILD}"

RCNAME:sf8008  = "octagon4"
RCNAME:sf8008m = "sf8008"

SOC_FAMILY    = "hisi3798mv200"
HICHIPSET     = "3798mv200"
LINUX_VERSION = "4.4.35"

MTD_KERNEL = "mmcblk0p12"
MTD_ROOTFS = "mmcblk0p16"

EXTRA_OECONF:append:pn-enigma2 = " --with-lcddev=/dev/null --with-alphablendingacceleration=always --with-blitaccelerationthreshold=250  --with-fillaccelerationthreshold=190000 --with-subttxtabnormalptsdiffs=3600000"

# Common MACHINE_FEATURES + per-box appends (sf8008 has dvb-c + inibt + oem-info)
MACHINE_FEATURES += " no-subssupport HDMI AV_JACK multitranscoding blindscan-dvbs 7segment WOL"
MACHINE_FEATURES:append:sf8008 = " dvb-c inibt oem-info"
MACHINE_FEATURES += " retrogaming retrogaming-hisi4k"

require conf/machine/include/octagon-hisi.inc
