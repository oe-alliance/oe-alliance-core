#@TYPE: Machine
#@NAME: Vu+ duo4klite
#@DESCRIPTION: Machine configuration for the Vu+ duo4klite

SOC_FAMILY = "bcm7252s"

# eMMC has 4 GB in total, but one image gets only 1 GB of that (Partitioned eMMC)
FLASHSIZE = "1024"

require conf/machine/include/vuplus.inc

MTD_BOOTFS = "mmcblk0p1"
MTD_BLACK  = "mmcblk0"
KERNEL_FILE = "kernel_auto.bin"
ROOTFS_FILE = "rootfs.tar.bz2"

MACHINE_FEATURES += "transcoding ci dvb-c mountboot quadpip kodi22 hbbtv-browser-webkit chromiumos colorlcd400 vu2bt ${E2EGL_WQHD_FEATURE} ${E2EGL_MACHINE_FEATURE}"

MACHINE_ESSENTIAL_EXTRA_RDEPENDS += "vuplus-bluetooth-keymaps"

### Logitech keyboard ###
KERNEL_MODULE_AUTOLOAD += "hid-logitech"
KERNEL_MODULE_AUTOLOAD += "hid-logitech-dj"

DVBSKYPROVIDER = "kernel"

PREFERRED_VERSION_linux-vuplus = "4.1.20"
