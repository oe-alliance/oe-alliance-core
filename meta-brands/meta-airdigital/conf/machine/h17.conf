# MACHINEBUILDS: zgemmah17combo zgemmah17twin
SOC_FAMILY = "bcm7251s"

FLASHSIZE = "4096"

RCTYPE = "28"
RCNAME = "zgemma7"

require conf/machine/include/airdigital-arm.inc

MACHINE_FEATURES += " dvb-c ci skins1080 ${E2EGL_WQHD_FEATURE} emmc mmc swap kodi22 7segment qthbbtv mountboot AV_JACK blindscan-dvbs v3d-nxpl arm-recovery ${E2EGL_MACHINE_FEATURE}"

IMAGE_CLASSES += "airdigital-emmc_image_multiboot16gb"

MTD_BOOTFS = "mmcblk0p1"
MTD_ROOTFS = "mmcblk0p12"
MTD_KERNEL = "mmcblk0p3"
KERNEL_FILE = "kernel.bin"
ROOTFS_FILE = "rootfs.tar.bz2"
MTD_BLACK  = "mmcblk0"
