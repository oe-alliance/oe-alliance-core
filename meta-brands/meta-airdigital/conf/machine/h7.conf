MACHINE_FEATURES += " dvb-c ci skins1080 ${E2EGL_WQHD_FEATURE} emmc mmc swap kodi22 7segment qthbbtv mountboot AV_JACK blindscan-dvbs v3d-nxpl ${E2EGL_MACHINE_FEATURE}"

