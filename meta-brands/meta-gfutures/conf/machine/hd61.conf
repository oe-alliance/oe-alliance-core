# MACHINEBUILDS: ax61
#@TYPE: Machine
#@NAME: hd61
#@DESCRIPTION: Machine configuration for the hd61

SOC_FAMILY = "hisi3798mv200"
HICHIPSET = "3798mv200"
VER = "-v2"

MACHINE_FEATURES += " hisil mali emmc mmc 7segment skins1080 ${E2EGL_WQHD_FEATURE} multitranscoding kodi22 himedia no-subssupport blindscan-dvbs gfwol WOL dvb-c ci fastboot mountboot hbbtv-browser-webkit ${E2EGL_MACHINE_FEATURE}"

EXTRA_OECONF:append:pn-enigma2 = " --with-alphablendingacceleration=always --with-blitaccelerationthreshold=250  --with-fillaccelerationthreshold=190000"

KERNEL_FILE = "uImage"
ROOTFS_FILE = "rootfs.tar.bz2"
MTD_BLACK  = "mmcblk0"
MTD_BOOTFS = "mmcblk0p4"

IMAGE_CLASSES += "hdemmc-fastboot8gb_image"
IMAGE_FSTYPES += "hdfastboot8gb"

require conf/machine/include/gfutures-hisil-3798mv200.inc
