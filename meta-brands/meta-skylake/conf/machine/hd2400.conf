# MACHINEBUILDS: mutant2400 quadbox2400
SOC_FAMILY = "bcm7425"

FLASHSIZE = "1024"

UBI_VOLNAME = "rootfs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 8192"
UBINIZE_ARGS = "-m 2048 -p 128KiB"

PREFERRED_VERSION_linux-skylake = "4.10.12"

require conf/machine/include/skylake-oem.inc

MACHINE_FEATURES += "ubimb chkrootmb emmc dvb-c ci fanctrl bwlcd255 videoenhancement skins1080 ${E2EGL_WQHD_FEATURE} multitranscoding blindscan-tbs kodi22 SCART YUV RCA HDMI-IN-HD v3d-nxpl ${E2EGL_MACHINE_FEATURE}"

IMAGE_CMD:ubifs:prepend = " \
    rm -rf ${IMAGE_ROOTFS}/boot/*; \
    rm -rf ${IMAGE_ROOTFS}/tmp/*; \
    "
