# MACHINEBUILDS: et5x00 et6x00 et9x00
#@TYPE: Machine
#@NAME: xt7413
#@DESCRIPTION: Shared machine for Xtrend ET5X00/ET6X00/ET9X00 (bcm7413)

MACHINE_NAME:et5x00 = "ET5X00"
MACHINE_NAME:et6x00 = "ET6X00"
MACHINE_NAME:et9x00 = "ET9X00"

RCTYPE:et5x00 = "7"
RCTYPE:et6x00 = "7"
RCTYPE:et9x00 = "5"

RCNAME:et5x00 = "et6x00"
RCNAME:et6x00 = "et6x00"
RCNAME:et9x00 = "et9x00"

RCHARDWARE = "V2"

# Broken bootloader can only flash around 100 MB
FLASHSIZE = "96"

PREFERRED_VERSION_linux-etxx00 = "3.8.7"

OEM_ARCH = "${MACHINEBUILD}"

SOC_FAMILY = "bcm7413"

UBI_VOLNAME = "rootfs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 4096"
UBINIZE_ARGS = "-m 2048 -p 128KiB"

MACHINE_FEATURES += "ubimb chkrootmb emmc skins1080 feature2 blindscan-tbs blindscan-dvbs boxmodel HDMI YUV smallflash oem-info"
MACHINE_FEATURES:append:et5x00 = " nolcd NO_SCART_SWITCH"
MACHINE_FEATURES:append:et6x00 = " textlcd SCART NO_SCART_SWITCH"
MACHINE_FEATURES:append:et9x00 = " textlcd ci fanctrl SCART"

require conf/machine/include/etxx00.inc
