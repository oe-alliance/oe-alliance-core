# MACHINEBUILDS: osmini4k osmio4k osmio4kplus
#@TYPE: Machine
#@NAME: ed72604
#@DESCRIPTION: Shared machine for Edision OSmini4K / OSmio4K / OSmio4K Plus (bcm72604)

MACHINE_NAME:osmini4k    = "OS mini 4k"
MACHINE_NAME:osmio4k     = "OS mio 4k"
MACHINE_NAME:osmio4kplus = "OS mio 4k plus"

OEM_ARCH = "${MACHINEBUILD}"

RCNAME     = "edision3"
SOC_FAMILY = "bcm72604"

MTD_BOOTFS  = "mmcblk1p1"
MTD_BLACK   = "mmcblk1"
MTD_KERNEL  = "mmcblk1p2"
MTD_ROOTFS  = "mmcblk1p3"
KERNEL_FILE = "kernel.bin"
ROOTFS_FILE = "rootfs.tar.bz2"

# Common MACHINE_FEATURES + per-box appends
MACHINE_FEATURES += "swap hbbtv-browser-webkit videoenhancement skins1080 ${E2EGL_WQHD_FEATURE} blindscan-tbs blindscan-dvbs mountboot HDMI kodi22 wifi-direct openhbbtv ${E2EGL_MACHINE_FEATURE}"
MACHINE_FEATURES:append:osmini4k    = " 7segment"
MACHINE_FEATURES:append:osmio4k     = " 7segment dvb-c inibt blindscan-dvbc"
MACHINE_FEATURES:append:osmio4kplus = " bwlcd128 dvb-c inibt blindscan-dvbc"

PREFERRED_PROVIDER_virtual/egl     = "edision-libv3d"

# Dedicated Edision V3D native ABI; enable only the current hardware target.
MACHINE_FEATURES += "retrogaming retrogaming-bcm-v3d"
PREFERRED_PROVIDER_virtual/libgles2 = "edision-libv3d"
PREFERRED_PROVIDER_virtual/kodi    = "stb-kodi-${MACHINEBUILD}"

# osmio4k and osmio4kplus want BT + Wi-Fi modules auto-loaded
KERNEL_MODULE_AUTOLOAD:append:osmio4k     = " hci_uart wlan"
KERNEL_MODULE_AUTOLOAD:append:osmio4kplus = " hci_uart wlan"

PACKAGECONFIG_ffmpeg:append:osmio4k     = " libv4l2"
PACKAGECONFIG_ffmpeg:append:osmio4kplus = " libv4l2"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:osmio4k     = " kernel-module-btqca kernel-module-hci-uart"
MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS:append:osmio4kplus = " kernel-module-btqca kernel-module-hci-uart"

require conf/machine/include/edision-arm.inc
