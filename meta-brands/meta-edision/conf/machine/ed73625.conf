# MACHINEBUILDS: osninoplus osninopro
#@TYPE: Machine
#@NAME: ed73625
#@DESCRIPTION: Shared machine for Edision OS nino+/nino pro (bcm73625)

MACHINE_NAME:osninoplus = "OS nino+"
MACHINE_NAME:osninopro  = "OS nino pro"

RCNAME:osninoplus = "edision1"
RCNAME:osninopro  = "edision2"

FLASHSIZE = "512"

PREFERRED_VERSION_linux-edision = "4.8.17"

OEM_ARCH = "${MACHINEBUILD}"

SOC_FAMILY = "bcm73625"

UBI_VOLNAME = "rootfs"
MKUBIFS_ARGS = "-m 2048 -e 126976 -c 4096 -F"
UBINIZE_ARGS = "-m 2048 -p 128KiB"

### 8723BS wireless/bluetooth ###
KERNEL_MODULE_AUTOLOAD += "r8723bs"
KERNEL_MODULE_AUTOLOAD += "8723ds"
KERNEL_MODULE_AUTOLOAD += "hci_uart"

MACHINE_ESSENTIAL_EXTRA_RRECOMMENDS += " \
    kernel-module-hci-uart \
    "

MACHINE_EXTRA_RRECOMMENDS += " \
    rtk-hciattach \
    linux-firmware-8723bs \
    linux-firmware-8723ds \
    "

DVBMEDIASINK_CONFIG = "--with-wma --with-wmv --with-pcm --with-dts --with-eac3 --with-h265 --with-vb6 --with-vb8 --with-spark"

require conf/machine/include/edision.inc

MACHINE_FEATURES += "ubimb chkrootmb emmc videoenhancement skins1080 7segment dvb-c inibt"
MACHINE_FEATURES:append:osninopro = " blindscan-dvbs blindscan-dvbc"
