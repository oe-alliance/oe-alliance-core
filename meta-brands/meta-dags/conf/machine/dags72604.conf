# MACHINEBUILDS: force4 lunix4k
include conf/machine/include/dags-arm.inc

PREFERRED_VERSION_linux-dags = "4.1.20"

VIRTUAL-RUNTIME_blindscan_dvbs = "dags-blindscan-dvbs-utils"

SOC_FAMILY = "bcm72604"

FLASHSIZE = "4096"


MACHINE_FEATURES += " kexecmb bootsplash emmc mmc omb hbbtv-browser-webkit kodi22 v3d proxy swap blindscan-dvbs textlcd ${E2EGL_WQHD_FEATURE} ${E2EGL_MACHINE_FEATURE}"

# Lunix 4K and Force 4 share the DAGS NxClient/NXPL graphics profile.
# The current DAGS stack has no ALSA PCM output; this is not an audio fix.
MACHINE_FEATURES += "retrogaming retrogaming-bcm-nxpl retrogaming-bcm-dags"
