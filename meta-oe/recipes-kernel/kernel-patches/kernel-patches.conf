# =============================================================================
# OE-Alliance Centralized Kernel Patch Definitions
# =============================================================================
#
# This file defines BitBake variables for all shared kernel patches used across
# multiple machine/brand kernel recipes. It is part of a three-component system:
#
#   1. kernel-patches.conf (this file)
#      Defines KERNEL_PATCH_* and KERNEL_PATCHES_* variables pointing to patch
#      files in the subdirectories below (gcc/, dvb/, wifi/, etc.).
#      Machine kernel recipes use these variables in their SRC_URI to pull in
#      the patches they need without duplicating file paths.
#
#   2. Patch files (subdirectories of this directory)
#      The actual .patch files, organized by category:
#        gcc/       - GCC/compiler compatibility fixes
#        binutils/  - Binutils compatibility fixes
#        dvb/       - DVB tuner, USB device, and frontend patches
#        wifi/      - WiFi/network driver patches
#        mips/      - MIPS architecture-specific fixes
#        brcm/      - Broadcom platform patches
#        misc/      - Miscellaneous kernel fixes
#
#   3. kernel-fixups.bbclass (meta-oe/classes/)
#      A bbclass inherited by kernel recipes that applies auto-detecting sed
#      fixes during do_patch. These replace patches that would otherwise need
#      many version-specific variants (e.g. yylloc fix, ARM section flags,
#      SMB dialect upgrade, NFS buffer size). A kernel recipe inherits this
#      class to get these fixes automatically without adding patches to SRC_URI.
#
# Usage in a kernel recipe:
#
#   inherit kernel-fixups
#
#   SRC_URI += " \
#       ${KERNEL_PATCH_GCC_SERIES} \
#       ${KERNEL_PATCH_BINUTILS241_V3} \
#       ${KERNEL_PATCHES_DVB_STV_SERIES} \
#       "
#
# Adding a new patch:
#   1. Place the .patch file in the appropriate subdirectory
#   2. Define a KERNEL_PATCH_* variable below pointing to it
#   3. Optionally add it to a KERNEL_PATCHES_*_SERIES group variable
#   4. Reference it in the kernel recipe's SRC_URI
#
# =============================================================================

