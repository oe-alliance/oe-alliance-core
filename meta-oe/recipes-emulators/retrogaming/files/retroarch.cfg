# OpenATV RetroGaming baseline. A writable copy is created on the first
# launch under /media/hdd/retrogaming or /media/usb/retrogaming.

config_save_on_exit = "true"

libretro_directory = "/usr/lib/libretro"
libretro_info_path = "/usr/share/libretro/info"
assets_directory = "/usr/share/libretro/assets"
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

video_driver = "gl"
video_context_driver = "fbdev_mali"
video_fullscreen = "true"
video_refresh_rate = "60.000000"
video_threaded = "true"
video_vsync = "true"
video_smooth = "false"
video_shader_enable = "false"

audio_driver = "alsa"
audio_out_rate = "48000"
audio_latency = "128"
audio_rate_control = "false"
audio_resampler = "sinc"
audio_sync = "true"

input_driver = "udev"
input_joypad_driver = "udev"
input_autodetect_enable = "true"
# Start + Select opens or closes the RetroArch menu. Deliberately do not use a
# gamepad quit combination, so an active game cannot be exited accidentally.
input_menu_toggle_gamepad_combo = "4"
input_quit_gamepad_combo = "0"
# RetroArch's udev driver normalizes the receiver remote KEY_EXIT event to
# KEY_CLEAR. EXIT therefore opens/closes the menu; POWER leaves RetroArch.
input_menu_toggle = "clear"
input_exit_emulator = "power"
# Keep the receiver volume keys active while RetroArch owns the input device.
input_volume_up = "add"
input_volume_down = "subtract"
input_audio_mute = "f9"
input_pause_toggle = "p"
menu_pause_libretro = "true"

menu_driver = "rgui"
menu_show_online_updater = "false"
menu_show_core_updater = "false"
menu_show_load_core = "true"

# Remote RetroPad support is compiled in, but intentionally opt-in because it
# accepts unauthenticated controller input from the local network.
network_remote_enable = "false"
network_remote_base_port = "55400"

pause_nonactive = "false"
quit_press_twice = "false"
