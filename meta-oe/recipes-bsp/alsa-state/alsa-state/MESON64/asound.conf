pcm.hdmidmix {
    type        dmix
    ipc_key     1024
    slave {
        pcm         "hw:0,0"
        period_size 1024
        buffer_size 8192
    }
}

pcm.dreamhdmi {
    type  softvol
    slave { pcm "hdmidmix" }
    control { name "Master"; card 0 }
}

ctl.dreamhdmi {
    type hw
    card 0
}

pcm.dreamspdif {
    type    dmix
    ipc_key 2048
    slave {
        pcm "hw:0,1"
        period_size 1024
        buffer_size 8192
    }
}

# Bluetooth A2DP via BlueALSA; pcm.bluetooth is written by the
# Bluetooth manager when an audio device is selected.
pcm.dreambt {
    type  softvol
    slave.pcm "bluetooth"
    control { name "Master"; card 0 }
}

pcm.!default {
    type      plug
    slave.pcm "dreamhdmi"
}
