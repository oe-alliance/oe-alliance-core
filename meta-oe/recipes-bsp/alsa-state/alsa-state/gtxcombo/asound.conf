pcm.dreamhdmi {
	type softvol
	slave.pcm "hw:0,2"
	control { name "Master"; card 0 }
}

# BTDevicesManager supplies pcm.bluetooth for the selected A2DP sink.
pcm.dreambt {
	type softvol
	slave.pcm "bluetooth"
	control { name "Master"; card 0 }
}

pcm.!default {
	type plug
	slave.pcm "dreamhdmi"
}

ctl.mixer0 {
	type hw
	card 0
}
